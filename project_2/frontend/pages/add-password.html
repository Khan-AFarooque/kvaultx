<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Password | KvaultX</title>
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 50%, #0c1916 0%, #050a09 100%) !important;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* Textarea and select styling */
        textarea, select, input[type="date"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #16302a !important;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            background: #080f0d !important;
            color: #ffffff !important;
            outline: none;
            transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
        }

        textarea:focus, select:focus, input[type="date"]:focus {
            border-color: #10b981 !important;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2) !important;
            transform: translateY(-1px);
        }

        button {
            background: #10b981 !important;
            color: #050a09 !important;
        }

        button:hover {
            background: #059669 !important;
            box-shadow: 0 10px 24px rgba(16, 185, 129, 0.25) !important;
        }

        /* Password strength indicator styles */
        #passwordStrength {
            font-weight: 600;
        }
        .weak { color: #ef4444; }
        .medium { color: #f39c12; }
        .strong { color: #10b981; }
    </style>
</head>
<body class="signup-page">

    <div class="signup-wrapper" style="margin-top: 60px; margin-bottom: 60px;">
        <div class="signup-card" style="max-width: 460px;">

            <div class="signup-brand">
                <div class="signup-brand-icon" aria-hidden="true">🔑</div>
                <h2 id="formTitle">Add Credential</h2>
                <p class="signup-subtitle">Securely store your login credentials</p>
            </div>

            <form id="vaultForm" style="background: transparent; border: none; padding: 0; box-shadow: none; backdrop-filter: none; animation: none; width: 100%;">
                
                <div class="field-group">
                    <label class="field-label" for="vaultTitle">Title</label>
                    <input type="text" id="vaultTitle" placeholder="Title (e.g. Google, GitHub)" required>
                </div>

                <div class="field-group">
                    <label class="field-label" for="vaultUsername">Username / Email</label>
                    <input type="text" id="vaultUsername" placeholder="Username / Email">
                </div>
                
                <div class="field-group">
                    <label class="field-label" for="vaultPassword">Password</label>
                    <div class="password-box">
                        <input type="password" id="vaultPassword" placeholder="Password" required>
                        <span id="toggleVaultPass" class="toggle-eye">👁</span>
                    </div>
                    <p id="passwordStrength"></p>
                </div>
                
                <div class="field-group">
                    <label class="field-label" for="vaultUrl">Website URL</label>
                    <input type="text" id="vaultUrl" placeholder="Website URL (e.g. https://google.com)">
                </div>

                <div class="field-group">
                    <label class="field-label" for="vaultNotes">Notes (Optional)</label>
                    <textarea id="vaultNotes" placeholder="Write any notes here..." style="height: 90px; resize: none;"></textarea>
                </div>

                <div class="field-group">
                    <label class="field-label" for="vaultCategory">Category</label>
                    <select id="vaultCategory">
                        <option value="Uncategorized">Uncategorized</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="Social">Social</option>
                        <option value="Finance">Finance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field-group">
                    <label class="field-label" for="vaultTags">Tags</label>
                    <input type="text" id="vaultTags" placeholder="Tags (comma separated, e.g. dev, work)">
                </div>
                
                <div class="field-group">
                    <label class="field-label" for="vaultExpiry">Password Expiry (Optional)</label>
                    <input type="date" id="vaultExpiry">
                </div>

                <div class="field-group" style="display: flex; align-items: center; gap: 10px; margin: 14px 0; background: rgba(255, 190, 11, 0.08); padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255, 190, 11, 0.3);">
                    <input type="checkbox" id="vaultIsFavorite" style="width: 18px; height: 18px; cursor: pointer; accent-color: #ffbe0b;">
                    <label for="vaultIsFavorite" style="margin: 0; cursor: pointer; font-size: 13.5px; font-weight: 600; color: #f1f5f9; display: flex; align-items: center; gap: 6px;">
                        <span style="font-size: 16px;">⭐</span> Bookmark as Favorite (Star marking)
                    </label>
                </div>

                <button id="saveVaultBtn" type="submit">Save to Vault</button>
                <button id="cancelVaultBtn" type="button" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #ffffff; margin-top: 10px;">Cancel</button>
            </form>

        </div>
    </div>

    <!-- =========================================================
         POPUP AUTH MODAL (SIGN IN / CREATE ACCOUNT FOR GUEST ACTIONS)
    ========================================================= -->
    <div id="authModalOverlay" class="auth-modal-overlay">
        <div class="auth-modal-card">
            <button class="auth-modal-close" onclick="closeAuthModal()" title="Close">&times;</button>
            
            <div style="text-align: center; margin-bottom: 8px;">
                <img src="../assets/logo.png" alt="KvaultX" style="height: 44px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0, 210, 255, 0.4)); margin-bottom: 8px;">
                <h3 style="font-size: 20px; font-weight: 800; margin: 0; background: linear-gradient(135deg, #00d2ff, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">KvaultX Vault</h3>
                <p id="authModalSubtitle" style="font-size: 13px; color: #a6bba8; margin-top: 4px;">Sign in or create an account to save your credentials.</p>
            </div>

            <!-- Segmented Pill Tabs -->
            <div class="auth-modal-tabs">
                <button type="button" id="tabAuthLogin" class="auth-modal-tab-btn active" onclick="switchAuthModalTab('login')">
                    🔐 Sign In
                </button>
                <button type="button" id="tabAuthSignup" class="auth-modal-tab-btn" onclick="switchAuthModalTab('signup')">
                    ✨ Create Account
                </button>
            </div>

            <!-- Login Panel -->
            <div id="modalLoginPanel" class="auth-modal-panel">
                <form id="modalLoginForm" onsubmit="handleModalLogin(event)">
                    <div class="auth-modal-field">
                        <label for="modalLoginEmail">Email Address</label>
                        <input type="email" id="modalLoginEmail" placeholder="name@domain.com" required autocomplete="email">
                    </div>

                    <div class="auth-modal-field">
                        <label for="modalLoginPassword">Master Password</label>
                        <div style="position: relative;">
                            <input type="password" id="modalLoginPassword" placeholder="••••••••••••" required autocomplete="current-password" style="padding-right: 40px;">
                            <span id="modalToggleLoginEye" onclick="toggleModalEye('modalLoginPassword', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 14px;">👁️</span>
                        </div>
                    </div>

                    <!-- Captcha Field -->
                    <div class="auth-modal-field">
                        <label>Security Verification</label>
                        <div style="display: flex; gap: 8px; margin-bottom: 8px; align-items: center;">
                            <span id="modalCaptchaText" onclick="loadModalCaptcha()" title="Click to refresh CAPTCHA" style="padding: 8px 16px; background: rgba(16, 185, 129, 0.18); border: 1px solid rgba(16, 185, 129, 0.45); border-radius: 8px; font-weight: 800; letter-spacing: 5px; color: #10b981; font-size: 18px; font-family: 'Courier New', monospace; user-select: all; cursor: pointer;">Loading...</span>
                            <button type="button" onclick="loadModalCaptcha()" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;" title="Refresh Captcha">↻</button>
                        </div>
                        <input type="text" id="modalCaptchaInput" placeholder="Enter security code above" required autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
                    </div>

                    <button type="submit" id="btnModalLoginSubmit" class="auth-modal-btn-submit">
                        Unlock Vault
                    </button>

                    <div style="margin-top: 14px; text-align: center; font-size: 12px;">
                        <a href="forgot.html" style="color: #10b981; text-decoration: none; font-weight: 500;">Forgot master password?</a>
                    </div>
                </form>
            </div>

            <!-- Signup Panel -->
            <div id="modalSignupPanel" class="auth-modal-panel hidden">
                <form id="modalSignupForm" onsubmit="handleModalSignup(event)">
                    <div class="auth-modal-field">
                        <label for="modalSignupName">Full Name</label>
                        <input type="text" id="modalSignupName" placeholder="Alex Morgan" required autocomplete="name">
                    </div>

                    <div class="auth-modal-field">
                        <label for="modalSignupEmail">Email Address</label>
                        <input type="email" id="modalSignupEmail" placeholder="name@domain.com" required autocomplete="email">
                    </div>

                    <div class="auth-modal-field">
                        <label for="modalSignupPassword">Create Master Password</label>
                        <div style="position: relative;">
                            <input type="password" id="modalSignupPassword" placeholder="Min. 8 chars (upper, number, symbol)" required autocomplete="new-password" style="padding-right: 40px;" oninput="checkModalSignupStrength(this.value)">
                            <span id="modalToggleSignupEye" onclick="toggleModalEye('modalSignupPassword', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 14px;">👁️</span>
                        </div>
                        <div id="modalPasswordStrengthBar" style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); margin-top: 6px; overflow: hidden; display: none;">
                            <div id="modalPasswordStrengthFill" style="height: 100%; width: 0%; transition: width 0.3s ease, background 0.3s ease;"></div>
                        </div>
                        <span id="modalPasswordStrengthText" style="font-size: 11px; color: #a6bba8; display: block; margin-top: 4px;"></span>
                    </div>

                    <div class="auth-modal-field">
                        <label for="modalSignupConfirm">Confirm Master Password</label>
                        <input type="password" id="modalSignupConfirm" placeholder="Re-type master password" required autocomplete="new-password">
                    </div>

                    <div style="margin-bottom: 16px; font-size: 12px; color: #a6bba8; display: flex; align-items: flex-start; gap: 8px;">
                        <input type="checkbox" id="modalAgreeTerms" required style="margin-top: 3px; accent-color: #10b981;">
                        <label for="modalAgreeTerms" style="cursor: pointer; line-height: 1.4;">
                            I accept the <a href="terms.html" target="_blank" style="color: #10b981;">Terms</a> & <a href="privacy.html" target="_blank" style="color: #10b981;">Privacy Policy</a>.
                        </label>
                    </div>

                    <button type="submit" id="btnModalSignupSubmit" class="auth-modal-btn-submit">
                        Create Free Vault
                    </button>
                </form>
            </div>

            <!-- Error / Status message box -->
            <div id="modalAuthFeedback" style="display: none; margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; text-align: center;"></div>
        </div>
    </div>

    <footer class="add-password-footer" style="text-align: center; padding: 16px; font-size: 13px; color: rgba(255, 255, 255, 0.5); border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: 40px; position: relative; bottom: 0; width: 100%;">
        © 2026 KvaultX. All rights reserved.
    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/password.js"></script>
</body>
</html>
